{% extends 'base.html' %}
{% block title %}Patient Form - EthyraTrials{% endblock %}
{% block content %}
<div class="card shadow-sm mt-4">
    <div class="card-header"><h4>{% if object %}Edit patient{% else %}New patient{% endif %}</h4></div>
    <div class="card-body">
        <form method="post">{% csrf_token %}
            {% for field in form %}
                <div class="mb-3">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>
            {% endfor %}
            <button class="btn btn-primary">Save patient</button>
            <a class="btn btn-secondary" href="{% url 'patients:list' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
