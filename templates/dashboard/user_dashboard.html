{% extends 'base.html' %}

{% block title %}User Dashboard{% endblock %}

{% block content %}
<div class="container mt-4">

    <h2 class="mb-3">Welcome, {{ request.user.name }}</h2>

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>My Trials</h5>
                <p>View your enrolled clinical trials</p>
                <a href="#" class="btn btn-primary btn-sm">View</a>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow p-3">
                <h5>Profile</h5>
                <p>Manage your personal information</p>
                <a href="#" class="btn btn-outline-primary btn-sm">Edit</a>
            </div>
        </div>

    </div>

</div>
{% endblock %}
