{% extends 'admin_panel/admin_base.html' %}

{% block page_title %}Delete Career{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-0">
                <h5 class="mb-0 text-danger">Delete Career Posting</h5>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete the career posting "<strong>{{ object.title }}</strong>"?</p>
                <p class="text-muted">This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Delete Career</button>
                        <a href="{% url 'admin_panel:careers_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
