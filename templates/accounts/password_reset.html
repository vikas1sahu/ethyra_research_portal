{% extends 'base.html' %}
{% block title %}Reset Password - EthyraTrials{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header"><h4>Password reset</h4></div>
            <div class="card-body">
                <form method="post">{% csrf_token %}
                    <div class="mb-3">{{ form.email.label_tag }}{{ form.email }}</div>
                    <button class="btn btn-primary">Send reset email</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
