{% extends 'base.html' %}

{% block title %}Password Reset Sent - EthyraTrials{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 p-4 text-center">

                <div class="mb-3">
                    <i class="bi bi-envelope-check fs-1 text-success"></i>
                </div>

                <h4 class="mb-2">Check your email</h4>

                <p class="text-muted">
                    If an account exists with this email, you will receive password reset instructions shortly.
                </p>

                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 mt-3">
                    Back to Login
                </a>

            </div>
        </div>

    </div>
</div>
{% endblock %}
